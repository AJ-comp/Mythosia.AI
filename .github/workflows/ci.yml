name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: mythosia_tests
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: mythosia_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mythosia_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.301

      - name: Setup Node for UI regression tests
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: build/ui-tests/package-lock.json

      - name: Setup pinned model preparation runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: build/pixie-model-requirements.txt

      - name: Cache the exact reviewed PIXIE model files
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            src/rag/Mythosia.AI.Rag.Search.Pixie/models/pixie/model.onnx
            src/rag/Mythosia.AI.Rag.Search.Pixie/models/pixie/model.int8.onnx
          key: pixie-${{ runner.os }}-730b515a74727b5f57f031a4c8108743b99e689f-dcf25f9fa452e61a48f5330a63a2aa68988ddac5bfc574a59c338ef1cff06e42-36bdc1f1fe0135d10667322a493fd6a32eb93e8f4f68d09004eeb92f39fc8f25-${{ hashFiles('build/prepare-pixie-model.py', 'build/pixie-model-requirements.txt') }}

      - name: Install DocFX
        run: dotnet tool install -g docfx --version 2.78.5

      - name: Restore
        run: dotnet restore Mythosia.AI.slnx

      - name: Audit direct and transitive NuGet packages
        shell: pwsh
        run: ./build/test-package-vulnerabilities.ps1

      - name: Verify release readiness structure and production coverage
        shell: pwsh
        run: ./build/test-release-readiness.ps1 -Offline

      - name: Verify release readiness rejection cases
        shell: pwsh
        run: ./build/test-release-readiness-safety.ps1

      - name: Verify NuGet publication safety contracts
        shell: pwsh
        run: ./build/test-publish-nuget-safety.ps1

      - name: Verify test category coverage
        shell: pwsh
        run: ./build/test-test-categories.ps1

      - name: Verify DeepSeek RAG rewriter model selection
        run: node --experimental-vm-modules build/test-deepseek-rewriter-ui.mjs

      - name: Install locked UI test dependencies
        run: npm ci --prefix build/ui-tests --ignore-scripts --registry=https://registry.npmjs.org/ --no-fund

      - name: Verify Chat UI controls, cancellation and safe Markdown rendering
        run: |
          node --experimental-vm-modules build/test-model-capabilities-ui.mjs
          node --experimental-vm-modules build/test-perplexity-agent-ui.mjs
          node --experimental-vm-modules build/test-perplexity-embedding-ui.mjs
          node --experimental-vm-modules build/test-chat-cancellation-ui.mjs
          node --experimental-vm-modules build/test-chat-markdown-ui.mjs
          node --experimental-vm-modules build/test-console-ui.mjs
          node --experimental-vm-modules build/test-i18n-ui.mjs
          node build/test-playground-video-ui.mjs

      - name: Prepare and verify model assets including cache hits
        run: |
          python -m venv .artifacts/pixie/release-venv
          .artifacts/pixie/release-venv/bin/python -m pip install -r build/pixie-model-requirements.txt
          .artifacts/pixie/release-venv/bin/python build/prepare-pixie-model.py

      - name: Build the complete solution
        run: dotnet build Mythosia.AI.slnx --configuration Release --no-restore -p:TreatWarningsAsErrors=true

      - name: Prepare DocFX reference assemblies
        shell: pwsh
        run: ./build/prepare-docfx-references.ps1 -NoRestore

      - name: Build documentation with warnings as errors
        run: docfx docfx.json --warningsAsErrors

      - name: Verify release documentation and package metadata
        shell: pwsh
        run: ./build/test-release-documentation.ps1

      - name: Verify committed API manifest
        run: git diff --exit-code -- api/.manifest

      - name: Run deterministic unit tests
        run: >-
          dotnet test
          --project tests/Mythosia.AI.Test/Mythosia.AI.Test.csproj
          --configuration Release
          --no-build
          --settings tests/Mythosia.AI.Test/serial.runsettings
          --filter "TestCategory=Unit"

      - name: Run RAG regression tests
        run: >-
          dotnet test
          --project tests/Mythosia.AI.Rag.Tests/Mythosia.AI.Rag.Tests.csproj
          --configuration Release
          --no-build

      - name: Run PIXIE deterministic tests without model downloads
        run: >-
          dotnet test
          --project tests/Mythosia.AI.Rag.Search.Pixie.Tests/Mythosia.AI.Rag.Search.Pixie.Tests.csproj
          --configuration Release
          --no-build
          --filter "TestCategory=Unit"

      - name: Verify real local PIXIE model inference
        shell: pwsh
        run: ./build/test-pixie-model.ps1 -NoBuild

      - name: Verify evaluation test category coverage
        shell: pwsh
        run: ./build/test-test-categories.ps1 -TestRoot ./tests/Mythosia.AI.Rag.Evaluation.Tests

      - name: Run deterministic retrieval evaluation tests
        run: >-
          dotnet test
          --project tests/Mythosia.AI.Rag.Evaluation.Tests/Mythosia.AI.Rag.Evaluation.Tests.csproj
          --configuration Release
          --no-build
          --filter "TestCategory=Unit"
          --minimum-expected-tests 1
          --report-trx
          --report-trx-filename evaluation.trx
          --results-directory artifacts/test-results/retrieval-evaluation

      - name: Run offline retrieval evaluation smoke test
        shell: pwsh
        run: >-
          ./build/test-retrieval-evaluation.ps1
          -Dataset tests/Mythosia.AI.Rag.Evaluation/Datasets/smoke.json
          -Methods bm25,dense,hybrid-bm25
          -Dense local-hash
          -OutputDirectory artifacts/retrieval-evaluation/ci-smoke
          -Baseline tests/Mythosia.AI.Rag.Evaluation/Datasets/Baselines/smoke-local-hash.json
          -MaxRegression 0.02
          -NoBuild

      - name: Add retrieval smoke results to the workflow summary
        if: ${{ always() }}
        shell: pwsh
        run: |
          $summary = 'artifacts/retrieval-evaluation/ci-smoke/summary.md'
          if (Test-Path -LiteralPath $summary -PathType Leaf) {
            Get-Content -LiteralPath $summary -Raw | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload retrieval evaluation smoke reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: retrieval-evaluation-ci
          path: |
            artifacts/retrieval-evaluation/ci-smoke/
            artifacts/test-results/retrieval-evaluation/
            artifacts/test-results/pixie-local-model/
          if-no-files-found: warn
          retention-days: 14

      - name: Run document loader tests
        run: >-
          dotnet test
          --project tests/Mythosia.Documents.Tests/Mythosia.Documents.Tests.csproj
          --configuration Release
          --no-build

      - name: Run MCP integration tests
        run: >-
          dotnet test
          --project tests/Mythosia.AI.Mcp.Tests/Mythosia.AI.Mcp.Tests.csproj
          --configuration Release
          --no-build

      - name: Run vLLM serving tests
        run: >-
          dotnet test
          --project tests/Mythosia.AI.Serving.Vllm.Tests/Mythosia.AI.Serving.Vllm.Tests.csproj
          --configuration Release
          --no-build

      - name: Run vector database tests
        env:
          MYTHOSIA_PG_CONN: Host=localhost;Port=5432;Database=mythosia_tests;Username=postgres;Password=mythosia_ci
        run: >-
          dotnet test
          --project tests/Mythosia.VectorDb.Tests/Mythosia.VectorDb.Tests.csproj
          --configuration Release
          --no-build
          --minimum-expected-tests 1
          --report-trx
          --report-trx-filename vectordb.trx
          --results-directory artifacts/test-results/vectordb

      - name: Require PostgreSQL regressions to execute
        shell: pwsh
        run: |
          [xml]$report = Get-Content -LiteralPath artifacts/test-results/vectordb/vectordb.trx -Raw
          $counters = $report.TestRun.ResultSummary.Counters
          if ([int]$counters.total -lt 1 -or [int]$counters.passed -ne [int]$counters.total) {
            throw 'VectorDb validation requires every test to pass; skipped or inconclusive database checks are not accepted.'
          }
          $regressions = @($report.TestRun.Results.UnitTestResult | Where-Object {
            $_.testName -like 'Hybrid_UsesConfiguredHnswEfSearch_*' -or
            $_.testName -eq 'Hybrid_UsesConfiguredIvfflatProbes_InItsOwnTransaction'
          })
          if ($regressions.Count -lt 3 -or @($regressions | Where-Object outcome -ne 'Passed').Count -ne 0) {
            throw 'The HNSW and IVFFlat runtime-setting regressions must execute and pass.'
          }

      - name: Upload vector database regression results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vectordb-regressions
          path: artifacts/test-results/vectordb/
          if-no-files-found: warn
          retention-days: 14

      - name: Pack and validate release packages
        shell: pwsh
        run: ./build/publish-nuget.ps1 -Mode Pack -ArtifactsDirectory ./artifacts

      - name: Test packages from isolated consumers
        shell: pwsh
        run: ./build/test-nuget-packages.ps1 -ArtifactsDirectory ./artifacts

      - name: Check patch whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git cat-file -e "${BASE_SHA}^{commit}"
          git diff --check "$BASE_SHA" "$GITHUB_SHA"
