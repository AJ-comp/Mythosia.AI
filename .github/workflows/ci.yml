name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.301

      - name: Install DocFX
        run: dotnet tool install -g docfx --version 2.78.5

      - name: Restore
        run: dotnet restore Mythosia.AI.slnx

      - name: Audit direct and transitive NuGet packages
        shell: pwsh
        run: ./build/test-package-vulnerabilities.ps1

      - name: Verify NuGet publication safety contracts
        shell: pwsh
        run: ./build/test-publish-nuget-safety.ps1

      - name: Verify test category coverage
        shell: pwsh
        run: ./build/test-test-categories.ps1

      - name: Verify DeepSeek RAG rewriter model selection
        run: node --experimental-vm-modules build/test-deepseek-rewriter-ui.mjs

      - name: Build the complete solution
        run: dotnet build Mythosia.AI.slnx --configuration Release --no-restore -p:TreatWarningsAsErrors=true

      - name: Prepare DocFX reference assemblies
        shell: pwsh
        run: ./build/prepare-docfx-references.ps1 -NoRestore

      - name: Build documentation with warnings as errors
        run: docfx docfx.json --warningsAsErrors

      - name: Verify release documentation and package metadata
        shell: pwsh
        run: ./build/test-release-documentation.ps1

      - name: Verify committed API manifest
        run: git diff --exit-code -- api/.manifest

      - name: Run deterministic unit tests
        run: >-
          dotnet test
          --project tests/Mythosia.AI.Test/Mythosia.AI.Test.csproj
          --configuration Release
          --no-build
          --settings tests/Mythosia.AI.Test/serial.runsettings
          --filter "TestCategory=Unit"

      - name: Run RAG regression tests
        run: >-
          dotnet test
          --project tests/Mythosia.AI.Rag.Tests/Mythosia.AI.Rag.Tests.csproj
          --configuration Release
          --no-build

      - name: Run PIXIE deterministic tests without model downloads
        run: >-
          dotnet test
          --project tests/Mythosia.AI.Rag.Search.Pixie.Tests/Mythosia.AI.Rag.Search.Pixie.Tests.csproj
          --configuration Release
          --no-build
          --filter "TestCategory=Unit"

      - name: Verify evaluation test category coverage
        shell: pwsh
        run: ./build/test-test-categories.ps1 -TestRoot ./tests/Mythosia.AI.Rag.Evaluation.Tests

      - name: Run deterministic retrieval evaluation tests
        run: >-
          dotnet test
          --project tests/Mythosia.AI.Rag.Evaluation.Tests/Mythosia.AI.Rag.Evaluation.Tests.csproj
          --configuration Release
          --no-build
          --filter "TestCategory=Unit"
          --minimum-expected-tests 1
          --report-trx
          --report-trx-filename evaluation.trx
          --results-directory artifacts/test-results/retrieval-evaluation

      - name: Run offline retrieval evaluation smoke test
        shell: pwsh
        run: >-
          ./build/test-retrieval-evaluation.ps1
          -Dataset tests/Mythosia.AI.Rag.Evaluation/Datasets/smoke.json
          -Methods bm25,dense,hybrid-bm25
          -Dense local-hash
          -OutputDirectory artifacts/retrieval-evaluation/ci-smoke
          -Baseline tests/Mythosia.AI.Rag.Evaluation/Datasets/Baselines/smoke-local-hash.json
          -MaxRegression 0.02
          -NoBuild

      - name: Add retrieval smoke results to the workflow summary
        if: ${{ always() }}
        shell: pwsh
        run: |
          $summary = 'artifacts/retrieval-evaluation/ci-smoke/summary.md'
          if (Test-Path -LiteralPath $summary -PathType Leaf) {
            Get-Content -LiteralPath $summary -Raw | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload retrieval evaluation smoke reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: retrieval-evaluation-ci
          path: |
            artifacts/retrieval-evaluation/ci-smoke/
            artifacts/test-results/retrieval-evaluation/
          if-no-files-found: warn
          retention-days: 14

      - name: Run document loader tests
        run: >-
          dotnet test
          --project tests/Mythosia.Documents.Tests/Mythosia.Documents.Tests.csproj
          --configuration Release
          --no-build

      - name: Run MCP integration tests
        run: >-
          dotnet test
          --project tests/Mythosia.AI.Mcp.Tests/Mythosia.AI.Mcp.Tests.csproj
          --configuration Release
          --no-build

      - name: Run vLLM serving tests
        run: >-
          dotnet test
          --project tests/Mythosia.AI.Serving.Vllm.Tests/Mythosia.AI.Serving.Vllm.Tests.csproj
          --configuration Release
          --no-build

      - name: Run vector database tests
        run: >-
          dotnet test
          --project tests/Mythosia.VectorDb.Tests/Mythosia.VectorDb.Tests.csproj
          --configuration Release
          --no-build

      - name: Pack and validate release packages
        shell: pwsh
        run: ./build/publish-nuget.ps1 -Mode Pack -ArtifactsDirectory ./artifacts

      - name: Test packages from isolated consumers
        shell: pwsh
        run: ./build/test-nuget-packages.ps1 -ArtifactsDirectory ./artifacts

      - name: Check patch whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git cat-file -e "${BASE_SHA}^{commit}"
          git diff --check "$BASE_SHA" "$GITHUB_SHA"
