name: Retrieval Evaluation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Offline uses BM25 and deterministic hash vectors; PIXIE uses the local model; OpenAI compares both with paid embeddings
        required: true
        type: choice
        options:
          - offline
          - pixie
          - openai
        default: offline
      dataset:
        description: Dataset JSON path relative to the repository root
        required: true
        type: string
        default: tests/Mythosia.AI.Rag.Evaluation/Datasets/repository-docs.json
      repeat:
        description: Measured search repetitions after one warmup (dense embeddings are shared)
        required: true
        type: number
        default: 3
      baseline:
        description: Optional committed results.json from this evaluation schema; incompatible baselines fail
        required: false
        type: string
        default: ''
      max_regression:
        description: Maximum absolute metric drop allowed against the optional baseline (0.02 means two percentage points)
        required: true
        type: number
        default: 0.02

permissions:
  contents: read

concurrency:
  group: retrieval-evaluation-${{ github.ref }}-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.301

      - name: Setup pinned model preparation runtime
        if: ${{ inputs.mode != 'offline' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: build/pixie-model-requirements.txt

      - name: Cache the exact reviewed PIXIE model files
        if: ${{ inputs.mode != 'offline' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            src/rag/Mythosia.AI.Rag.Search.Pixie/models/pixie/model.onnx
            src/rag/Mythosia.AI.Rag.Search.Pixie/models/pixie/model.int8.onnx
          key: pixie-${{ runner.os }}-730b515a74727b5f57f031a4c8108743b99e689f-dcf25f9fa452e61a48f5330a63a2aa68988ddac5bfc574a59c338ef1cff06e42-36bdc1f1fe0135d10667322a493fd6a32eb93e8f4f68d09004eeb92f39fc8f25-${{ hashFiles('build/prepare-pixie-model.py', 'build/pixie-model-requirements.txt') }}

      - name: Prepare and verify model assets including cache hits
        if: ${{ inputs.mode != 'offline' }}
        run: |
          python -m venv .artifacts/pixie/evaluation-venv
          .artifacts/pixie/evaluation-venv/bin/python -m pip install -r build/pixie-model-requirements.txt
          .artifacts/pixie/evaluation-venv/bin/python build/prepare-pixie-model.py

      - name: Build the complete solution
        run: dotnet build Mythosia.AI.slnx --configuration Release -p:TreatWarningsAsErrors=true

      - name: Verify evaluation test category coverage
        shell: pwsh
        run: ./build/test-test-categories.ps1 -TestRoot ./tests/Mythosia.AI.Rag.Evaluation.Tests

      - name: Run deterministic evaluation tests
        run: >-
          dotnet test
          --project tests/Mythosia.AI.Rag.Evaluation.Tests/Mythosia.AI.Rag.Evaluation.Tests.csproj
          --configuration Release
          --no-build
          --filter "TestCategory=Unit"
          --minimum-expected-tests 1
          --report-trx
          --report-trx-filename evaluation.trx
          --results-directory artifacts/test-results/retrieval-evaluation

      - name: Verify real local model inference
        if: ${{ inputs.mode != 'offline' }}
        shell: pwsh
        run: ./build/test-pixie-model.ps1 -NoBuild

      - name: Reuse validated content-addressed OpenAI embeddings
        if: ${{ inputs.mode == 'openai' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/retrieval-evaluation/cache/
          key: retrieval-embeddings-${{ runner.os }}-${{ hashFiles('tests/Mythosia.AI.Rag.Evaluation/DenseEmbeddingCache.cs', 'src/rag/Mythosia.AI.Rag/Embeddings/OpenAIEmbeddingProvider.cs') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            retrieval-embeddings-${{ runner.os }}-${{ hashFiles('tests/Mythosia.AI.Rag.Evaluation/DenseEmbeddingCache.cs', 'src/rag/Mythosia.AI.Rag/Embeddings/OpenAIEmbeddingProvider.cs') }}-

      - name: Run the selected retrieval comparison
        shell: pwsh
        env:
          EVALUATION_MODE: ${{ inputs.mode }}
          EVALUATION_DATASET: ${{ inputs.dataset }}
          EVALUATION_REPEAT: ${{ inputs.repeat }}
          EVALUATION_BASELINE: ${{ inputs.baseline }}
          EVALUATION_MAX_REGRESSION: ${{ inputs.max_regression }}
          OPENAI_API_KEY: ${{ inputs.mode == 'openai' && secrets.OPENAI_API_KEY || '' }}
        run: |
          $parameters = @{
            Dataset = $env:EVALUATION_DATASET
            OutputDirectory = "artifacts/retrieval-evaluation/workflow-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
            Warmup = 1
            Repeat = [int]$env:EVALUATION_REPEAT
            NoBuild = $true
          }
          switch ($env:EVALUATION_MODE) {
            'offline' { $parameters.Methods = @('bm25', 'dense', 'hybrid-bm25'); $parameters.Dense = 'local-hash' }
            'pixie' { $parameters.Methods = @('bm25', 'pixie'); $parameters.Dense = 'none' }
            'openai' { $parameters.Methods = @('bm25', 'pixie', 'dense', 'hybrid-bm25', 'hybrid-pixie'); $parameters.Dense = 'openai' }
            default { throw 'Unknown evaluation mode.' }
          }
          if (-not [string]::IsNullOrWhiteSpace($env:EVALUATION_BASELINE)) {
            $parameters.Baseline = $env:EVALUATION_BASELINE
            $parameters.MaxRegression = [double]::Parse($env:EVALUATION_MAX_REGRESSION, [Globalization.CultureInfo]::InvariantCulture)
          }
          ./build/test-retrieval-evaluation.ps1 @parameters

      - name: Add evaluation results to the workflow summary
        if: ${{ always() }}
        shell: pwsh
        run: |
          $summary = "artifacts/retrieval-evaluation/workflow-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT/summary.md"
          if (Test-Path -LiteralPath $summary -PathType Leaf) {
            Get-Content -LiteralPath $summary -Raw | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload evaluation reports and test results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: retrieval-${{ inputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/retrieval-evaluation/workflow-${{ github.run_id }}-${{ github.run_attempt }}/
            artifacts/test-results/retrieval-evaluation/
            artifacts/test-results/pixie-local-model/
          if-no-files-found: warn
          retention-days: 30
