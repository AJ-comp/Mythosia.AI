<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title description">
<title id="title">Mythosia.AI package architecture</title>
<desc id="description">Sixteen packages grouped by responsibility. Core AI and RAG orchestration: Mythosia.AI and Mythosia.AI.Rag. Provider and tool extensions: Mythosia.AI.Providers.Alibaba and Mythosia.AI.Mcp. Independent server management: Mythosia.AI.Serving.Vllm. Document loaders: Mythosia.Documents.Office and Mythosia.Documents.Pdf. Vector stores and search: Mythosia.VectorDb.InMemory, Mythosia.VectorDb.Postgres, Mythosia.VectorDb.Qdrant, Mythosia.VectorDb.Pinecone, and the source preview Mythosia.AI.Rag.Search.Pixie. Shared abstractions: Mythosia.AI.Abstractions, Mythosia.AI.Rag.Abstractions, Mythosia.Documents.Abstractions, and Mythosia.VectorDb.Abstractions. Each white or dark card is one package. Group position does not imply a direct dependency; see the README dependency diagram for exact references.</desc>
